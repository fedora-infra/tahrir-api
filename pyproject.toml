[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "RUF"]
ignore = ["S324"]  # Allow use of md5 & sha1

[tool.ruff.lint.isort]
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.coverage.run]
branch = true
source = [
    "tahrir_api",
]

[tool.coverage.report]
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
omit = [
    "tests/*",
    "tahrir_api/migrations/env.py",
]

[project]
authors = [
    {name = "Ross Delinger", email = "rdelinge@redhat.com"},
    {name = "Fedora Infrastructure", email = "admin@fedoraproject.org"},
]
license = {text = "GPLv3+"}
requires-python = "<4.0.0,>=3.10.0"
dependencies = [
    "pygments<3.0.0,>=2.17.2",
    "simplejson<4.0.0,>=3.19.2",
    "sqlalchemy<3.0.0,>=2.0.29",
    "arrow<2.0.0,>=1.3.0",
    "alembic<2.0.0,>=1.13.1",
    "fedora-messaging<4.0.0,>=3.5.0",
    "tahrir-messages>=1.0.2",
    "sqlalchemy-helpers>=0.13.0",
]
name = "tahrir-api"
version = "1.4.3"
description = "An API for interacting with the Tahrir database"
readme = "README.rst"
classifiers = [
    "Programming Language :: Python",
    "Topic :: Internet :: WWW/HTTP",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.urls]
homepage = "https://github.com/fedora-infra/tahrir-api"
repository = "https://github.com/fedora-infra/tahrir-api"

[project.optional-dependencies]
scripts = [
    "fasjson-client<2.0.0,>=1.0.8",
    "click<9.0.0,>=8.0.0",
]

[project.scripts]
tahrir-sync-db = "tahrir_api.scripts.syncdb:main"
tahrir-populate-series = "tahrir_api.scripts.populateseries:main"
tahrir-populate-avatars = "tahrir_api.scripts.populate_avatars:main"
tahrir-compute-rarities = "tahrir_api.scripts.compute_rarities:main"

[dependency-groups]
dev = [
    "coverage[toml]>=7.4.4",
    "ruff>=0.3.5",
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
]
