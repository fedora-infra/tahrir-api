[tox]
envlist = py3{10,11,12,13,14},format,lint
# If the user is missing an interpreter, don't fail
skip_missing_interpreters = True

[testenv]
passenv = HOME
skip_install = true
sitepackages = false
allowlist_externals =
    uv
commands_pre =
    uv sync --all-extras
commands =
	uv run pytest -vv --cov=tahrir_api --cov-report term-missing --cov-report html {posargs:tests/}

[testenv:format]
commands =
    uv run ruff format --check tests/ tahrir_api/

[testenv:lint]
commands =
    uv run ruff check tests/ tahrir_api/
